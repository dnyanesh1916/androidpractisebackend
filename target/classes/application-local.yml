server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

spring:
  datasource:
    url: jdbc:h2:mem:attendease_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

attendease:
  company:
    latitude: 18.468571
    longitude: 77.458331
    radius-meters: 200
